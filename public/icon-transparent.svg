<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background Variant -->

  <!-- Outer Vinyl Groove / Acoustic Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#FF7A00" stroke-width="14" opacity="0.4" />
  
  <!-- Middle Vinyl Groove Ring -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#D4AF37" stroke-width="12" opacity="0.65" />

  <!-- Inner Signal Ring -->
  <circle cx="256" cy="256" r="104" fill="none" stroke="#FF7A00" stroke-width="16" stroke-linecap="round" />

  <!-- Studio Audio Waveform / Center Signal Core -->
  <g fill="#FF7A00">
    <!-- Center Peak Diamond / Master Transducer -->
    <path d="M256 96 L276 256 L256 416 L236 256 Z" fill="#FF7A00" />
    <path d="M256 160 L268 256 L256 352 L244 256 Z" fill="#D4AF37" />

    <!-- Waveform Frequency Bars (Left) -->
    <rect x="200" y="156" width="14" height="200" rx="7" fill="#FF7A00" />
    <rect x="168" y="186" width="14" height="140" rx="7" fill="#D4AF37" />
    <rect x="136" y="212" width="14" height="88" rx="7" fill="#FF7A00" />
    <rect x="104" y="232" width="14" height="48" rx="7" fill="#FF7A00" opacity="0.8" />

    <!-- Waveform Frequency Bars (Right) -->
    <rect x="298" y="156" width="14" height="200" rx="7" fill="#FF7A00" />
    <rect x="330" y="186" width="14" height="140" rx="7" fill="#D4AF37" />
    <rect x="362" y="212" width="14" height="88" rx="7" fill="#FF7A00" />
    <rect x="394" y="232" width="14" height="48" rx="7" fill="#FF7A00" opacity="0.8" />

    <!-- Center Core Point -->
    <circle cx="256" cy="256" r="10" fill="#050505" />
    <circle cx="256" cy="256" r="5" fill="#D4AF37" />
  </g>
</svg>
