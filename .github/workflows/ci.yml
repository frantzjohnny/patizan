name: CI

on:
  push:
    branches: ["preview/manual-booking"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Supabase CLI
        run: npm i -g supabase
      - name: Start Supabase locally
        run: supabase start &
        env:
          SUPABASE_DEBUG: true
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432; then break; else echo "waiting..."; sleep 1; fi
          done
        shell: bash
      - name: Apply schema and migration
        run: |
          psql -h localhost -U postgres -d postgres -f supabase/schema.sql
          psql -h localhost -U postgres -d postgres -f supabase/migrations/20231110_01_booking_conflict_fix.sql
        env:
          PGPASSWORD: postgres
      - name: Run booking conflict tests
        run: bash scripts/test_booking_conflict.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
